{% extends 'base.html' %}

{% block title%}
Home
{% endblock %}

{% block content%}

{% load static %}


<div id="carouselExampleDark" class="carousel carousel-dark slide"
     data-bs-ride="carousel"
     style="height: 250px; overflow: hidden;">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="10">
        <img src="{% static 'images/host1.png' %}" class="d-block w-100" style="height: 250px; object-fit: cover; object-position: top;" alt="Hospital 1">
      </div>
      <div class="carousel-item" data-bs-interval="2000">
        <img src="{% static 'images/host2.png' %}" class="d-block w-100" style="height: 250px; object-fit: cover; object-position: top;" alt="Hospital 1">
        
      </div>
      <div class="carousel-item">
        <img src="{% static 'images/host3.png' %}" class="d-block w-100" style="height: 250px; object-fit: cover; object-position: top;" alt="Hospital 1">
        
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>


{% endblock %}
